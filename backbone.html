<html>

<head>
    <script src="calculator.js" defer></script>
    <link rel="stylesheet" href="classic.css">
    <title>calculator</title>
</head>

<body>
    <div id="calculator">
        <div id="output">
        </div>
        <div id="input">
            <form>
                <input type="button" value="del" id="del">
                <input type="button" value="clr" id="clr">
                <input type="button" value="%" id="mod">
                <input type="button" value="/" id="divide">
                <br>
                <input type="button" value="7" id="num7">
                <input type="button" value="8" id="num8">
                <input type="button" value="9" id="num9">
                <input type="button" value="*" id="multiply">
                <br>
                <input type="button" value="4" id="num4">
                <input type="button" value="5" id="num5">
                <input type="button" value="6" id="num6">
                <input type="button" value="-" id="subtract">
                <br>
                <input type="button" value="1" id="num1">
                <input type="button" value="2" id="num2">
                <input type="button" value="3" id="num3">
                <input type="button" value="+" id="add">
                <br>
                <input type="button" value="+/-" id="negate">
                <input type="button" value="0" id="num0">
                <input type="button" value="." id="dot">
                <input type="button" value="=" id="equal">
                <br>
                <input type="button" value="(" id="left">
                <input type="button" value=")" id="right">
                <input type="button" value="m+" id="memorize">
                <input type="button" value="m-" id="unmemorize">
            </form>
        </div>
    </div>
</body>

</html>
